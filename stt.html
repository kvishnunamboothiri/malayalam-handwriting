<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<title>Speech helper</title>
</head>
<body>
<p>Speech helper for the Malayalam Handwriting Linux app. It runs hidden and sends what Google's speech
recognition hears back to the app. You can close it by stopping the microphone in the app.</p>
<script>
// Runs inside Chrome (the only engine here with Google's speech recognition). The Linux app starts it hidden.
const q = new URLSearchParams(location.search);
const token = q.get("t") || "", lang = q.get("lang") || "ml-IN";
const post = (o) => fetch("/__stt", { method: "POST", headers: { "X-ML-Token": token }, body: JSON.stringify(o) }).catch(() => {});
let stopping = false, levelStarted = false;

function start() {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) { post({ error: "unsupported" }); return; }
  const rec = new Rec();
  rec.lang = lang;
  rec.continuous = true;
  rec.interimResults = true;
  rec.onstart = () => post({ state: "listening" });
  rec.onaudiostart = () => { if (!levelStarted) { levelStarted = true; setTimeout(startLevel, 1200); } };
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i], t = r[0].transcript.trim();
      if (r.isFinal) { if (t) post({ final: t }); } else interim += " " + r[0].transcript;
    }
    if (interim.trim()) post({ interim: interim.trim() });
  };
  rec.onerror = (e) => {
    if (e.error === "no-speech" || e.error === "aborted") return;     // normal: nobody spoke for a while
    stopping = true;                                                   // permission, network or microphone problem
    post({ error: e.error });
  };
  rec.onend = () => { if (!stopping) setTimeout(start, 300); };        // Chrome ends sessions on its own; keep listening
  try { rec.start(); } catch (err) { post({ error: String(err.message || err) }); }
}
start();

// Also report the microphone level, so the app can draw its level bar for this engine too. It starts a moment after
// recognition has begun, so the two never open the microphone at the same instant.
async function startLevel() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new AudioContext();
    await ac.resume();
    const analyser = ac.createAnalyser();
    analyser.fftSize = 1024;
    ac.createMediaStreamSource(stream).connect(analyser);
    const buf = new Float32Array(analyser.fftSize);
    setInterval(() => {
      analyser.getFloatTimeDomainData(buf);
      let sum = 0;
      for (const v of buf) sum += v * v;
      post({ level: Math.sqrt(sum / buf.length) });
    }, 120);
  } catch (err) { /* the level bar just stays empty */ }
}
</script>
</body>
</html>
